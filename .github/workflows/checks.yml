name: SanA1 checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  audit:
    name: Audit on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/*.mjs
      - name: Check both QR refund documents with local rules
        run: |
          python -m tools.check_qr_case
          python -m tools.check_qr_case tests/fixtures/qr-refund-corrected.docx
      - name: Check the official case and corrected variants
        run: |
          python -c "import os; from pathlib import Path; from organizer_input import official_input_bytes; (Path(os.environ['RUNNER_TEMP']) / 'hackathon-requirements.md').write_bytes(official_input_bytes())"
          python -m tools.check_official_case "$RUNNER_TEMP/hackathon-requirements.md"
          python run.py "$RUNNER_TEMP/hackathon-requirements.md" "$RUNNER_TEMP/review.md" --rules-only --answers --json
          python -m tools.check_expanded_acceptance "$RUNNER_TEMP/hackathon-requirements.md" --report "$RUNNER_TEMP/review.json"
